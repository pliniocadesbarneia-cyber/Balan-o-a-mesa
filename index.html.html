function fileToResizedBase64(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function thumbFromDataUrl(dataUrl, maxDim = 140, quality = 0.5) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
      else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.src = dataUrl;
  });
}

function extractJson(text) {
  const cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  const start = cleaned.indexOf("{");
  const end = cleaned.lastIndexOf("}");
  if (start === -1 || end === -1) throw new Error("Sem JSON na resposta");
  return JSON.parse(cleaned.slice(start, end + 1));
}

const GEMINI_MODEL_FALLBACKS = ["gemini-flash-latest", "gemini-2.5-flash", "gemini-2.0-flash"];

function geminiEndpointFor(model) {
  return "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent";
}
function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

async function callGeminiRaw(payload, modelIndex, retryCount) {
  modelIndex = modelIndex || 0;
  retryCount = retryCount || 0;
  const model = GEMINI_MODEL_FALLBACKS[modelIndex];
  const res = await fetch(geminiEndpointFor(model), {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": GEMINI_API_KEY },
    body: JSON.stringify(payload),
  });
  if (res.status === 404 && modelIndex < GEMINI_MODEL_FALLBACKS.length - 1) {
    return callGeminiRaw(payload, modelIndex + 1, 0);
  }
  if ((res.status === 503 || res.status === 429) && retryCount < 2) {
    await delay(1200 * (retryCount + 1));
    return callGeminiRaw(payload, modelIndex, retryCount + 1);
  }
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error("http_" + res.status + (t ? " — " + t.slice(0, 300) : ""));
  }
  return res.json();
}

async function callClaude({ imageBase64, promptText, learningNotes }) {
  // (nome mantido por compatibilidade com o resto do código — hoje chama o Gemini)
  const system = `Você é um nutricionista clínico especialista em análise visual de refeições. Responda SEMPRE e APENAS com um objeto JSON válido, sem markdown, sem texto antes ou depois. Nunca invente certeza que não tem.

Esquema exato de resposta:
{
  "confidence": "alta" | "media" | "baixa",
  "identified_items": [
    {"name": string, "estimated_portion": string, "calories": number, "protein_g": number, "carbs_g": number, "fat_g": number, "fiber_g": number}
  ],
  "total": {"calories": number, "protein_g": number, "carbs_g": number, "fat_g": number, "fiber_g": number, "sodium_mg": number},
  "clarifying_questions": [string],
  "suggestions": [string],
  "diagnosis": string
}

Regras:
- Se não conseguir identificar algum ingrediente com segurança (ex: tipo de óleo, se o arroz é integral ou branco, se há açúcar no molho, tamanho exato da porção), NÃO adivinhe silenciosamente: liste a dúvida em "clarifying_questions" (máx. 3, direto ao ponto, em português).
- Se o usuário já respondeu perguntas anteriores (fornecidas abaixo), incorpore essas respostas nos cálculos e deixe "clarifying_questions" vazio se a dúvida foi resolvida.
- "diagnosis" deve ser um parágrafo curto (3-5 frases) avaliando o equilíbrio da refeição.
- "suggestions" deve ter de 2 a 4 trocas ou ajustes práticos e específicos.
- Números sempre em valores realistas por porção observada, nunca zero a menos que realmente não exista aquele macronutriente.
- Responda em português do Brasil.
${learningNotes ? `\nContexto de preferências e correções aprendidas deste usuário em refeições anteriores: ${learningNotes}` : ""}`;

  const payload = {
    system_instruction: { parts: [{ text: system }] },
    contents: [
      {
        role: "user",
        parts: [
          { inline_data: { mime_type: "image/jpeg", data: imageBase64.split(",")[1] } },
          { text: promptText },
        ],
      },
    ],
    generationConfig: { temperature: 0.4, maxOutputTokens: 1500 },
  };

  const data = await callGeminiRaw(payload, 0, 0);
  const candidate = data && data.candidates && data.candidates[0];
  const blocked = data && data.promptFeedback && data.promptFeedback.blockReason;
  if (blocked || !candidate) throw new Error("Resposta bloqueada ou vazia do modelo");
  const replyText = candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text;
  if (!replyText) throw new Error("Resposta vazia do modelo");
  return extractJson(replyText);
}

function DayTotals({ meals }) {
  const key = todayKey();
  const todays = meals.filter((m) => todayKey(new Date(m.timestamp)) === key);
  const totals = todays.reduce(
    (acc, m) => {
      const t = m.result.total || {};
      acc.calories += t.calories || 0;
      acc.protein_g += t.protein_g || 0;
      acc.carbs_g += t.carbs_g || 0;
      acc.fat_g += t.fat_g || 0;
      acc.fiber_g += t.fiber_g || 0;
      return acc;
    },
    { calories: 0, protein_g: 0, carbs_g: 0, fat_g: 0, fiber_g: 0 }
  );
  if (todays.length === 0) return null;
  return (
    <div style={{ background: C.dark, color: C.darkText, borderRadius: 12, padding: "16px 20px", marginBottom: 16, width: "100%" }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <span style={{ ...mono, fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: C.darkMuted }}>Balanço de hoje</span>
        <span style={{ ...mono, fontSize: 10, color: C.darkMuted }}>{todays.length} refeição{todays.length > 1 ? "ões" : ""}</span>
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 6, marginBottom: 12 }}>
        <span style={{ ...serif, fontSize: 36, lineHeight: 1 }}>{Math.round(totals.calories)}</span>
        <span style={{ fontSize: 14, color: C.darkMuted, marginBottom: 4 }}>kcal consumidas</span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, textAlign: "center" }}>
        {[
          ["Prot", totals.protein_g, "#7fd9ac"],
          ["Carb", totals.carbs_g, "#f0b15f"],
          ["Gord", totals.fat_g, "#e79088"],
          ["Fibra", totals.fiber_g, "#7fd9ac"],
        ].map(([label, val, color]) => (
          <div key={label} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 8, padding: "8px 0" }}>
            <div style={{ ...mono, fontSize: 14, fontWeight: 600, color }}>{Math.round(val)}g</div>
            <div style={{ fontSize: 9, textTransform: "uppercase", letterSpacing: 0.4, color: C.darkMuted, marginTop: 2 }}>{label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// =========================================================
// Main App
// =========================================================
function App() {
  const [screen, setScreen] = useState("capture");
  const [imgDataUrl, setImgDataUrl] = useState(null);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [answers, setAnswers] = useState({});
  const [meals, setMeals] = useState([]);
  const [profile, setProfile] = useState({ notes: [], mealsAnalyzed: 0 });
  const [isOnline, setIsOnline] = useState(true);
  const [saved, setSaved] = useState(false);
  const cameraInputRef = useRef(null);
  const galleryInputRef = useRef(null);

  useEffect(() => {
    loadMeals().then(setMeals).catch(() => {});
    loadProfile().then(setProfile).catch(() => {});
    if (typeof navigator !== "undefined") setIsOnline(navigator.onLine);
    const on = () => setIsOnline(true);
    const off = () => setIsOnline(false);
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    return () => {
      window.removeEventListener("online", on);
      window.removeEventListener("offline", off);
    };
  }, []);

  const resetToCapture = () => {
    setScreen("capture"); setImgDataUrl(null); setResult(null);
    setError(null); setAnswers({}); setSaved(false);
  };

  const handleFile = async (file) => {
    if (!file) return;
    setError(null);
    const resized = await fileToResizedBase64(file);
    setImgDataUrl(resized);
    setScreen("analyzing");
    runAnalysis(resized, "Analise esta refeição.", null);
  };

  const runAnalysis = async (image, promptText, learningNotes) => {
    try {
      const r = await callClaude({ imageBase64: image, promptText, learningNotes });
      setResult(r);
      setScreen(r.clarifying_questions?.length > 0 ? "questions" : "result");
    } catch (e) {
      console.error(e);
      setError(
        !isOnline
          ? "Sem conexão. A análise por foto precisa de internet — mas seu histórico salvo continua disponível offline."
          : "Não consegui analisar a foto agora. Tente novamente ou tire uma foto com mais luz e enquadrando o prato inteiro."
      );
      setScreen("capture");
    }
  };

  const submitAnswers = () => {
    const answerText = Object.entries(answers).map(([q, a]) => `Pergunta: ${q}\nResposta do usuário: ${a}`).join("\n\n");
    const learningNotes = profile.notes.slice(-8).join("; ");
    setScreen("analyzing");
    runAnalysis(
      imgDataUrl,
      `Analise esta refeição novamente. O usuário respondeu às suas perguntas anteriores:\n\n${answerText}\n\nRecalcule os valores com essas informações e deixe clarifying_questions vazio se tudo ficou claro.`,
      learningNotes
    );
  };

  const handleSave = async () => {
    const thumb = await thumbFromDataUrl(imgDataUrl);
    const entry = { id: uid(), timestamp: Date.now(), thumb, result };
    const updated = [entry, ...meals];
    setMeals(updated);
    await saveMeals(updated);

    if (Object.keys(answers).length > 0) {
      const newNotes = [...profile.notes, ...Object.entries(answers).map(([q, a]) => `${q} → ${a}`)];
      const updatedProfile = { notes: newNotes.slice(-30), mealsAnalyzed: profile.mealsAnalyzed + 1 };
      setProfile(updatedProfile);
      await saveProfile(updatedProfile);
    } else {
      const updatedProfile = { ...profile, mealsAnalyzed: profile.mealsAnalyzed + 1 };
      setProfile(updatedProfile);
      await saveProfile(updatedProfile);
    }
    setSaved(true);
  };

  const deleteMeal = async (id) => {
    const updated = meals.filter((m) => m.id !== id);
    setMeals(updated);
    await saveMeals(updated);
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column", fontFamily: "Inter, system-ui, sans-serif" }}>
      <header style={{ position: "sticky", top: 0, zIndex: 10, background: C.dark, color: C.darkText, padding: "20px 20px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <h1 style={{ ...serif, fontSize: 22, lineHeight: 1.2, margin: 0 }}>Balanço à Mesa</h1>
            <p style={{ fontSize: 11, color: C.darkMuted, margin: "2px 0 0" }}>fotografe · descubra · ajuste</p>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {!isOnline && (
              <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, background: "rgba(255,255,255,0.1)", padding: "4px 8px", borderRadius: 999, color: "#f0b15f" }}>
                <WifiOff size={12} /> offline
              </span>
            )}
            <button
              onClick={() => setScreen(screen === "history" ? "capture" : "history")}
              style={{ padding: 8, borderRadius: 999, background: "rgba(255,255,255,0.1)", border: "none", color: C.darkText, cursor: "pointer" }}
              aria-label="Histórico"
            >
              <History size={16} />
            </button>
          </div>
        </div>
      </header>

      <main style={{ flex: 1, padding: 20, maxWidth: 420, margin: "0 auto", width: "100%" }}>
        {screen === "history" && (
          <div>
            <DayTotals meals={meals} />
            {meals.length === 0 ? (
              <p style={{ fontSize: 14, color: C.mutedLight, textAlign: "center", padding: "40px 0" }}>
                Nenhuma refeição salva ainda. Fotografe seu primeiro prato para começar seu diário.
              </p>
            ) : (
              <ul style={{ display: "flex", flexDirection: "column", gap: 8, listStyle: "none", padding: 0, margin: 0 }}>
                {meals.map((m) => (
                  <li key={m.id} style={{ background: "#fff", borderRadius: 10, padding: 12, display: "flex", alignItems: "center", gap: 12, boxShadow: "0 1px 2px rgba(0,0,0,0.06)" }}>
                    <img src={m.thumb} alt="" style={{ width: 56, height: 56, borderRadius: 8, objectFit: "cover", flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                        <span style={{ ...mono, fontSize: 14, fontWeight: 600, color: C.ink }}>{Math.round(m.result.total?.calories || 0)} kcal</span>
                        <span style={{ fontSize: 11, color: C.muted }}>
                          {new Date(m.timestamp).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}{" "}
                          {new Date(m.timestamp).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}
                        </span>
                      </div>
                      <p style={{ fontSize: 12, color: "#5a6455", margin: "2px 0 0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                        {m.result.identified_items?.map((i) => i.name).join(", ") || "Refeição"}
                      </p>
                    </div>
                    <button onClick={() => deleteMeal(m.id)} style={{ padding: 6, background: "transparent", border: "none", color: "#c1a7a7", cursor: "pointer" }} aria-label="Remover">
                      <X size={16} />
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        )}

        {screen === "capture" && (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 24 }}>
            <DayTotals meals={meals} />

            {error && (
              <div style={{ width: "100%", background: C.redBg, color: C.redSoft, fontSize: 14, borderRadius: 10, padding: "12px 16px", marginBottom: 16, display: "flex", gap: 8 }}>
                <AlertTriangle size={16} style={{ flexShrink: 0, marginTop: 2 }} />
                <span>{error}</span>
              </div>
            )}

            <div style={{ width: "100%", background: "#fff", borderRadius: 14, padding: 32, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", boxShadow: "0 1px 2px rgba(0,0,0,0.06)" }}>
              <p style={{ fontSize: 14, color: "#5a6455", marginBottom: 24, maxWidth: 280 }}>
                Fotografe seu prato de frente e com boa luz. Eu identifico os alimentos, calculo as calorias e nutrientes, e sugiro ajustes.
              </p>

              <div
                role="button" tabIndex={0}
                onClick={() => cameraInputRef.current?.click()}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cameraInputRef.current?.click(); } }}
                style={{ width: 96, height: 96, borderRadius: "50%", background: C.orange, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 20px rgba(232,135,30,0.4)", marginBottom: 16, cursor: "pointer" }}
                aria-label="Fotografar refeição"
              >
                <Camera size={36} color="#fff" />
              </div>
              <input
                ref={cameraInputRef} id="camera-capture-input" type="file" accept="image/*" capture="environment"
                style={hiddenFileInput} onChange={(e) => handleFile(e.target.files?.[0])}
              />
              <span style={{ fontSize: 12, color: C.muted, marginBottom: 20 }}>toque para fotografar</span>

              <div
                role="button" tabIndex={0}
                onClick={() => galleryInputRef.current?.click()}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); galleryInputRef.current?.click(); } }}
                style={{ fontSize: 14, color: C.green, fontWeight: 500, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}
              >
                <Upload size={14} />
                ou envie da galeria
                <input ref={galleryInputRef} type="file" accept="image/*" style={hiddenFileInput} onChange={(e) => handleFile(e.target.files?.[0])} />
              </div>
            </div>

            {profile.mealsAnalyzed > 0 && (
              <p style={{ fontSize: 11, color: C.muted, marginTop: 16, textAlign: "center", maxWidth: 280 }}>
                Já aprendi com {profile.mealsAnalyzed} refeição{profile.mealsAnalyzed > 1 ? "ões" : ""} suas — minhas estimativas ficam mais precisas conforme você usa o app.
              </p>
            )}
          </div>
        )}

        {screen === "analyzing" && (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", paddingTop: 80 }}>
            {imgDataUrl && <img src={imgDataUrl} alt="" style={{ width: 160, height: 160, objectFit: "cover", borderRadius: 14, marginBottom: 24, boxShadow: "0 4px 12px rgba(0,0,0,0.12)" }} />}
            <Loader2 size={28} className="animate-spin" style={{ color: C.green, marginBottom: 12 }} />
            <p style={{ fontSize: 14, color: "#5a6455" }}>Identificando alimentos e calculando nutrientes…</p>
          </div>
        )}

        {screen === "questions" && result && (
          <div>
            {imgDataUrl && <img src={imgDataUrl} alt="" style={{ width: "100%", height: 176, objectFit: "cover", borderRadius: 14, marginBottom: 16 }} />}
            <div style={{ background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 1px 2px rgba(0,0,0,0.06)" }}>
              <p style={{ fontSize: 14, color: "#5a6455", marginBottom: 16, display: "flex", alignItems: "flex-start", gap: 8 }}>
                <AlertTriangle size={16} style={{ color: C.orange, flexShrink: 0, marginTop: 2 }} />
                Não tenho certeza sobre alguns pontos do prato. Responda para eu refinar o diagnóstico:
              </p>
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                {result.clarifying_questions.map((q, i) => (
                  <div key={i}>
                    <label style={{ fontSize: 14, fontWeight: 500, color: C.ink, display: "block", marginBottom: 6 }}>{q}</label>
                    <input
                      type="text"
                      style={{ width: "100%", border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 12px", fontSize: 14, boxSizing: "border-box" }}
                      placeholder="Sua resposta…"
                      onChange={(e) => setAnswers((prev) => ({ ...prev, [q]: e.target.value }))}
                    />
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
                <button
                  onClick={() => setScreen("result")}
                  style={{ flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500, color: C.muted, border: `1px solid ${C.border}`, background: "#fff", cursor: "pointer" }}
                >
                  Pular
                </button>
                <button
                  onClick={submitAnswers}
                  style={{ flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 600, color: "#fff", background: C.green, border: "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 4, cursor: "pointer" }}
                >
                  Refinar diagnóstico <ChevronRight size={15} />
                </button>
              </div>
            </div>
          </div>
        )}

        {screen === "result" && result && (
          <div>
            {imgDataUrl && <img src={imgDataUrl} alt="" style={{ width: "100%", height: 176, objectFit: "cover", borderRadius: 14, marginBottom: 16 }} />}
            <ReceiptCard result={result} onDiscard={resetToCapture} onSave={handleSave} saved={saved} />
            <button onClick={resetToCapture} style={{ width: "100%", textAlign: "center", fontSize: 14, color: C.green, fontWeight: 500, marginTop: 16, padding: 8, background: "transparent", border: "none", cursor: "pointer" }}>
              Fotografar outra refeição
            </button>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
